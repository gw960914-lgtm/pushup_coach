<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>육군 정자세 팔굽혀펴기 AI 모바일 코치</title>
    <!-- MediaPipe Pose CDN (iOS/Android 공용) -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose/pose.js" crossorigin="anonymous"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        body {
            background-color: #0b110c;
            color: #e2eae3;
            font-family: -apple-system, BlinkMacSystemFont, "Malgun Gothic", sans-serif;
            overflow-x: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }
        header {
            width: 100%;
            background: #111a13;
            border-bottom: 2px solid #233827;
            padding: 10px 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .header-title { font-size: 14px; font-weight: bold; color: #39e75f; }
        .badge {
            background: #17381d;
            border: 1px solid #39e75f;
            color: #39e75f;
            font-size: 10px;
            padding: 2px 6px;
            border-radius: 3px;
        }

        .camera-container {
            position: relative;
            width: 100%;
            max-width: 480px;
            aspect-ratio: 4 / 3;
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }
        canvas {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        /* iOS 비디오 인라인 재생 필수 */
        video { display: none; }

        .hud-overlay {
            position: absolute;
            top: 10px;
            left: 10px;
            right: 10px;
            display: flex;
            justify-content: space-between;
            pointer-events: none;
        }
        .hud-card {
            background: rgba(11, 17, 12, 0.85);
            border: 1px solid #233827;
            padding: 6px 12px;
            border-radius: 6px;
            text-align: center;
        }
        .hud-val { font-size: 24px; font-weight: bold; color: #ffffff; font-family: monospace; }
        .hud-lbl { font-size: 10px; color: #8b9b8e; }

        .feedback-banner {
            position: absolute;
            bottom: 12px;
            left: 10px;
            right: 10px;
            padding: 8px 12px;
            background: rgba(17, 26, 19, 0.9);
            border: 1px solid #39e75f;
            border-radius: 6px;
            text-align: center;
            font-size: 13px;
            font-weight: bold;
            color: #39e75f;
            transition: all 0.2s;
        }
        .feedback-banner.warn { border-color: #e74c3c; color: #ff5252; background: rgba(40, 10, 10, 0.9); }

        .control-panel {
            width: 100%;
            max-width: 480px;
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .btn-group { display: flex; gap: 8px; }
        button {
            flex: 1;
            padding: 12px;
            font-size: 13px;
            font-weight: bold;
            border-radius: 6px;
            border: 1px solid #39e75f;
            background: #218c39;
            color: #fff;
            cursor: pointer;
        }
        button:active { filter: brightness(0.8); }
        button.btn-sub { background: #131c15; border-color: #233827; color: #a3b8a6; }
        button.btn-reset { background: #7a1f1f; border-color: #e74c3c; }

        .guide-card {
            background: #131c15;
            border: 1px solid #233827;
            border-radius: 6px;
            padding: 10px;
            font-size: 11px;
            color: #a3b8a6;
            line-height: 1.5;
        }
        .guide-card b { color: #39e75f; }
    </style>
</head>
<body>

<header>
    <div class="header-title">🛡️ 입영 전 팔굽혀펴기 정자세 AI 코치</div>
    <div class="badge">모바일 브라우저 전용</div>
</header>

<div class="camera-container">
    <canvas id="outputCanvas"></canvas>
    <video id="inputVideo" playsinline webkit-playsinline muted autoplay></video>

    <div class="hud-overlay">
        <div class="hud-card">
            <div class="hud-val" id="repCount">0</div>
            <div class="hud-lbl">정자세 카운트</div>
        </div>
        <div class="hud-card">
            <div class="hud-val" id="elbowAngle">0°</div>
            <div class="hud-lbl">팔꿈치 각도</div>
        </div>
        <div class="hud-card">
            <div class="hud-val" id="coreAngle">0°</div>
            <div class="hud-lbl">코어 각도</div>
        </div>
    </div>

    <div class="feedback-banner" id="feedbackText">측면 1.5m 바닥에 폰을 세우고 시작하세요</div>
</div>

<div class="control-panel">
    <div class="btn-group">
        <button id="btnStart" onclick="startApp()">📹 카메라 켜기</button>
        <button class="btn-sub" onclick="switchCamera()">🔄 전/후면 전환</button>
        <button class="btn-reset" onclick="resetCount()">0회 리셋</button>
    </div>

    <div class="guide-card">
        <b>[스마트폰 거치 요령]</b><br>
        1. 폰을 바닥 물병이나 신발에 기대어 <b>측면 1.5~2m 거리</b>에 세웁니다.<br>
        2. 머리부터 발끝까지 화면 안에 온전히 들어가도록 엎드립니다.<br>
        3. <b>정자세 기준</b>: 팔꿈치 90° 이하 하강 + 팔 완전히 펴기 + 허리 처짐 방지.
    </div>
</div>

<script>
    var videoElement = document.getElementById('inputVideo');
    var canvasElement = document.getElementById('outputCanvas');
    var canvasCtx = canvasElement.getContext('2d');

    var repCount = 0;
    var state = "UP"; // UP -> DOWN -> UP
    var facingMode = "user"; // "user" (전면) or "environment" (후면)
    var pose = null;
    var camera = null;
    var lastFeedbackTime = 0;

    // 모바일 Web Speech API (음성 코칭)
    function speak(text) {
        if (!('speechSynthesis' in window)) return;
        var now = Date.now();
        if (now - lastFeedbackTime < 1800) return; // 1.8초 음성 중복 방지
        lastFeedbackTime = now;

        window.speechSynthesis.cancel();
        var msg = new SpeechSynthesisUtterance(text);
        msg.lang = 'ko-KR';
        msg.rate = 1.1; // 신속한 코칭 템포
        window.speechSynthesis.speak(msg);
    }

    // 3점 사이 각도 산출
    function getAngle(A, B, C) {
        var rad = Math.atan2(C.y - B.y, C.x - B.x) - Math.atan2(A.y - B.y, A.x - B.x);
        var deg = Math.abs(rad * 180.0 / Math.PI);
        if (deg > 180.0) deg = 360.0 - deg;
        return Math.round(deg);
    }

    function setFeedback(text, isWarn) {
        var el = document.getElementById('feedbackText');
        el.innerText = text;
        if (isWarn) {
            el.className = "feedback-banner warn";
        } else {
            el.className = "feedback-banner";
        }
    }

    function resetCount() {
        repCount = 0;
        state = "UP";
        document.getElementById('repCount').innerText = repCount;
        setFeedback("측정 준비 완료", false);
    }

    function initPose() {
        pose = new Pose({
            locateFile: function(file) {
                return "https://cdn.jsdelivr.net/npm/@mediapipe/pose/" + file;
            }
        });

        pose.setOptions({
            modelComplexity: 0, // 0: 모바일 최적화 경량 모델
            smoothLandmarks: true,
            minDetectionConfidence: 0.5,
            minTrackingConfidence: 0.5
        });

        pose.onResults(onResults);
    }

    function startApp() {
        document.getElementById('btnStart').style.display = 'none';
        setFeedback("신체 인식 준비 중...", false);
        // iOS 오디오 권한 잠금 해제
        speak("자세를 잡으세요");
        initPose();
        startStream();
    }

    function startStream() {
        if (camera) {
            camera.stop();
        }

        camera = new Camera(videoElement, {
            onFrame: async function() {
                await pose.send({ image: videoElement });
            },
            width: 640,
            height: 480,
            facingMode: facingMode
        });
        camera.start();
    }

    function switchCamera() {
        facingMode = (facingMode === "user") ? "environment" : "user";
        startStream();
    }

    function onResults(results) {
        canvasElement.width = videoElement.videoWidth || 640;
        canvasElement.height = videoElement.videoHeight || 480;

        canvasCtx.save();
        canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);

        // 전면 카메라 사용 시 좌우 거울 반전
        if (facingMode === "user") {
            canvasCtx.translate(canvasElement.width, 0);
            canvasCtx.scale(-1, 1);
        }
        canvasCtx.drawImage(results.image, 0, 0, canvasElement.width, canvasElement.height);

        if (!results.poseLandmarks) {
            setFeedback("전신이 나오도록 거리를 조정하세요", true);
            canvasCtx.restore();
            return;
        }

        var lm = results.poseLandmarks;

        // 카메라에 더 잘 보이는 측면 선택 (가시도 비교)
        var leftVis = (lm[11].visibility + lm[23].visibility) / 2;
        var rightVis = (lm[12].visibility + lm[24].visibility) / 2;
        var isLeft = leftVis >= rightVis;

        var shoulder = isLeft ? lm[11] : lm[12];
        var elbow = isLeft ? lm[13] : lm[14];
        var wrist = isLeft ? lm[15] : lm[16];
        var hip = isLeft ? lm[23] : lm[24];
        var ankle = isLeft ? lm[27] : lm[28];

        var w = canvasElement.width;
        var h = canvasElement.height;

        var pShoulder = { x: shoulder.x * w, y: shoulder.y * h };
        var pElbow = { x: elbow.x * w, y: elbow.y * h };
        var pWrist = { x: wrist.x * w, y: wrist.y * h };
        var pHip = { x: hip.x * w, y: hip.y * h };
        var pAnkle = { x: ankle.x * w, y: ankle.y * h };

        // 1. 관절 각도 계산
        var elbowAng = getAngle(pShoulder, pElbow, pWrist);
        var coreAng = getAngle(pShoulder, pHip, pAnkle);

        document.getElementById('elbowAngle').innerText = elbowAng + "°";
        document.getElementById('coreAngle').innerText = coreAng + "°";

        // 2. 코어 정렬 검증 (145도 미만 허리 처짐)
        var isCoreBad = coreAng < 145;

        // 3. 골격선 렌더링
        var boneColor = isCoreBad ? "#ff3333" : (state === "DOWN" ? "#e5a93c" : "#39e75f");
        drawLine(pShoulder, pElbow, boneColor);
        drawLine(pElbow, pWrist, boneColor);
        drawLine(pShoulder, pHip, boneColor);
        drawLine(pHip, pAnkle, boneColor);

        // 4. 팔굽혀펴기 계측 및 음성 코칭 FSM
        if (isCoreBad) {
            setFeedback("⚠️ 허리가 처졌습니다! 코어 힘 유지", true);
            speak("허리 펴세요");
        } else {
            if (state === "UP") {
                if (elbowAng <= 90) {
                    state = "DOWN";
                    setFeedback("✅ 충분 하강! 팔을 밀어 올리세요", false);
                } else if (elbowAng > 90 && elbowAng < 130) {
                    setFeedback("더 깊게 내려가세요 (90도 이하)", false);
                }
            } else if (state === "DOWN") {
                if (elbowAng >= 160) {
                    repCount++;
                    state = "UP";
                    document.getElementById('repCount').innerText = repCount;
                    setFeedback("정자세 인정 (" + repCount + "회)", false);
                    speak(repCount + "");
                } else if (elbowAng > 95 && elbowAng < 150) {
                    // 완전히 안 펴고 다시 내려가려는 경우
                    setFeedback("팔을 끝까지 펴야 횟수가 인정됩니다", true);
                }
            }
        }

        canvasCtx.restore();
    }

    function drawLine(p1, p2, color) {
        canvasCtx.strokeStyle = color;
        canvasCtx.lineWidth = 4;
        canvasCtx.beginPath();
        canvasCtx.moveTo(p1.x, p1.y);
        canvasCtx.lineTo(p2.x, p2.y);
        canvasCtx.stroke();
    }
</script>
</body>
</html>
