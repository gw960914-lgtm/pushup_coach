<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>육군 정자세 팔굽혀펴기 AI 정밀 측정체계</title>
    <!-- MediaPipe Pose CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose/pose.js" crossorigin="anonymous"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        body {
            background-color: #0b110c;
            color: #e2eae3;
            font-family: -apple-system, BlinkMacSystemFont, "Malgun Gothic", Dotum, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding-bottom: 30px;
        }
        header {
            width: 100%;
            background: #111a13;
            border-bottom: 2px solid #233827;
            padding: 10px 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .header-title { font-size: 14px; font-weight: bold; color: #39e75f; }
        .badge {
            background: #17381d;
            border: 1px solid #39e75f;
            color: #39e75f;
            font-size: 10px;
            padding: 2px 7px;
            border-radius: 3px;
        }

        /* 카메라 컨테이너 및 전체화면 스타일 */
        .camera-container {
            position: relative;
            width: 100%;
            max-width: 500px;
            aspect-ratio: 4 / 3;
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            border-bottom: 2px solid #233827;
            transition: all 0.3s ease;
        }
        .camera-container.is-fullscreen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            max-width: none;
            aspect-ratio: auto;
            z-index: 99999;
            border: none;
        }

        canvas {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        video { display: none; }

        /* HUD 오버레이 */
        .hud-overlay {
            position: absolute;
            top: 8px;
            left: 8px;
            right: 8px;
            display: flex;
            justify-content: space-between;
            pointer-events: none;
            gap: 4px;
        }
        .hud-card {
            background: rgba(11, 17, 12, 0.85);
            border: 1px solid #233827;
            padding: 5px 6px;
            border-radius: 5px;
            text-align: center;
            flex: 1;
        }
        .hud-val { font-size: 18px; font-weight: bold; color: #ffffff; font-family: monospace; }
        .hud-lbl { font-size: 9px; color: #8b9b8e; }

        .btn-fullscreen-toggle {
            position: absolute;
            top: 8px;
            right: 8px;
            z-index: 10;
            background: rgba(17, 26, 19, 0.85);
            border: 1px solid #39e75f;
            color: #39e75f;
            padding: 5px 8px;
            font-size: 11px;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
        }

        .feedback-banner {
            position: absolute;
            bottom: 8px;
            left: 8px;
            right: 8px;
            padding: 8px 10px;
            background: rgba(17, 26, 19, 0.9);
            border: 1px solid #39e75f;
            border-radius: 5px;
            text-align: center;
            font-size: 12px;
            font-weight: bold;
            color: #39e75f;
            transition: all 0.2s;
        }
        .feedback-banner.warn { border-color: #e74c3c; color: #ff5252; background: rgba(40, 10, 10, 0.9); }

        .main-panel {
            width: 100%;
            max-width: 500px;
            padding: 10px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .card {
            background: #131c15;
            border: 1px solid #233827;
            border-radius: 6px;
            padding: 10px;
        }
        .card-title {
            font-size: 12px;
            font-weight: bold;
            color: #39e75f;
            margin-bottom: 6px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .timer-presets {
            display: flex;
            gap: 5px;
            margin-bottom: 6px;
        }
        .btn-preset {
            flex: 1;
            padding: 6px;
            font-size: 11px;
            font-weight: bold;
            background: #1c2a1f;
            border: 1px solid #2d4233;
            color: #a3b8a6;
            border-radius: 4px;
            cursor: pointer;
        }
        .btn-preset.active {
            background: #218c39;
            color: #ffffff;
            border-color: #39e75f;
        }

        .timer-custom-row {
            display: flex;
            gap: 6px;
            align-items: center;
        }
        .timer-custom-row input {
            width: 70px;
            background: #0d120e;
            border: 1px solid #2d4233;
            color: #fff;
            padding: 5px;
            border-radius: 4px;
            font-size: 11px;
            text-align: center;
        }

        .btn-group { display: flex; gap: 6px; margin-top: 4px; }
        button.action-btn {
            flex: 1;
            padding: 10px;
            font-size: 12px;
            font-weight: bold;
            border-radius: 5px;
            cursor: pointer;
            border: 1px solid transparent;
        }
        .btn-start { background: #218c39; border-color: #39e75f; color: #fff; }
        .btn-pause { background: #d35400; border-color: #e67e22; color: #fff; }
        .btn-sub { background: #1f3323; border-color: #2d4233; color: #a3b8a6; }
        .btn-reset { background: #7a1f1f; border-color: #e74c3c; color: #fff; }

        .log-table-wrap {
            max-height: 160px;
            overflow-y: auto;
            border: 1px solid #1f3323;
            border-radius: 4px;
            background: #0d140e;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 10.5px;
            text-align: left;
        }
        th, td {
            padding: 5px 6px;
            border-bottom: 1px solid #1a261c;
        }
        th {
            background: #111a13;
            color: #8b9b8e;
            position: sticky;
            top: 0;
        }
        .td-time { color: #e5a93c; font-family: monospace; font-weight: bold; width: 65px; }
        .td-reason { color: #ff6b6b; font-weight: bold; }
        .td-detail { color: #8b9b8e; font-size: 9.5px; }
    </style>
</head>
<body>

<header>
    <div class="header-title">🛡️ 육군 팔굽혀펴기 AI 정밀 측정체계</div>
    <div class="badge">6대 부정자세 감지</div>
</header>

<div class="camera-container" id="cameraBox">
    <canvas id="outputCanvas"></canvas>
    <video id="inputVideo" playsinline webkit-playsinline muted autoplay></video>

    <!-- 전체화면 토글 버튼 -->
    <button type="button" class="btn-fullscreen-toggle" id="btnFullscreen" onclick="toggleFullscreen()">⛶ 전체화면</button>

    <!-- 상단 HUD -->
    <div class="hud-overlay" id="hudOverlay">
        <div class="hud-card">
            <div class="hud-val" id="repCount">0</div>
            <div class="hud-lbl">정자세</div>
        </div>
        <div class="hud-card">
            <div class="hud-val" id="dispTimer" style="color:#e5a93c;">02:00</div>
            <div class="hud-lbl">잔여시간</div>
        </div>
        <div class="hud-card">
            <div class="hud-val" id="elbowAngle">0°</div>
            <div class="hud-lbl">팔꿈치(≤90°)</div>
        </div>
        <div class="hud-card">
            <div class="hud-val" id="coreAngle">0°</div>
            <div class="hud-lbl">코어(145~185°)</div>
        </div>
    </div>

    <!-- 하단 실시간 안내 배너 -->
    <div class="feedback-banner" id="feedbackText">카메라를 켜고 엎드려뻗쳐 자세를 잡으십시오</div>
</div>

<div class="main-panel">
    <div class="card">
        <div class="card-title">
            <span>⏱️ 측정 시간 설정</span>
            <span id="txtTimerState" style="font-size:10px; color:#8b9b8e;">대기 중</span>
        </div>
        <div class="timer-presets">
            <button type="button" class="btn-preset active" onclick="setTimerPreset(120, this)">2분 (육군검정)</button>
            <button type="button" class="btn-preset" onclick="setTimerPreset(60, this)">1분 (단련)</button>
            <button type="button" class="btn-preset" onclick="setTimerPreset(30, this)">30초</button>
        </div>
        <div class="timer-custom-row">
            <span style="font-size:11px; color:#8b9b8e;">직접 입력:</span>
            <input type="number" id="inCustomSec" placeholder="초" min="10" max="600" onchange="applyCustomTimer()">
            <span style="font-size:11px; color:#8b9b8e;">초 설정</span>
        </div>
    </div>

    <div class="btn-group">
        <button type="button" class="action-btn btn-start" id="btnMainAction" onclick="toggleTimerAndCamera()">📹 측정 시작 (카메라 ON)</button>
        <button type="button" class="action-btn btn-sub" onclick="switchCamera()">🔄 전/후면</button>
        <button type="button" class="action-btn btn-reset" onclick="resetAll()">0회 초기화</button>
    </div>

    <div class="card">
        <div class="card-title">
            <span>⚠️ 부정자세(No-Count) 타임스탬프 이력 (3초 쿨다운 적용)</span>
            <span id="failCount" style="color:#ff6b6b; font-size:11px;">0건</span>
        </div>
        <div class="log-table-wrap">
            <table>
                <thead>
                    <tr>
                        <th style="width: 25%;">경과 시간</th>
                        <th style="width: 45%;">불합격 사유</th>
                        <th style="width: 30%;">관측 수치</th>
                    </tr>
                </thead>
                <tbody id="logTableBody">
                    <tr id="emptyRow">
                        <td colspan="3" style="text-align:center; color:#8b9b8e; padding:12px;">부정자세 기록이 없습니다.</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<script>
    var videoElement = document.getElementById('inputVideo');
    var canvasElement = document.getElementById('outputCanvas');
    var canvasCtx = canvasElement.getContext('2d');
    var cameraBox = document.getElementById('cameraBox');

    var repCount = 0;
    var state = "UP"; // UP -> DOWN -> UP
    var facingMode = "user";
    var pose = null;
    var camera = null;
    var cameraStarted = false;

    // 타이머
    var totalSeconds = 120;
    var remainingSeconds = 120;
    var timerInterval = null;
    var isTimerRunning = false;

    // 관절 움직임 추적
    var minElbowInCurrentRep = 180;
    var maxElbowInCurrentRep = 90;
    var repHasFault = false;
    var failCount = 0;

    // 부정자세 유형별 독립 3초(3000ms) 쿨다운 관리 객체
    var faultCooldowns = {
        SAG: 0,        // 허리 숙여짐 (처짐)
        PIKE: 0,       // 허리 세워짐 (솟음)
        KNEE: 0,       // 무릎 닿음
        HEAD: 0,       // 고개만 숙임
        SHALLOW: 0,    // 덜 내려감
        INCOMPLETE: 0  // 팔꿈치 안 펴짐
    };

    // 음성(TTS) 엔진 관리
    var isSpeaking = false;

    function speak(text) {
        if (!('speechSynthesis' in window)) return;
        if (window.speechSynthesis.speaking || isSpeaking) return;

        isSpeaking = true;
        var msg = new SpeechSynthesisUtterance(text);
        msg.lang = 'ko-KR';
        msg.rate = 1.15;
        msg.pitch = 1.0;

        msg.onend = function() { isSpeaking = false; };
        msg.onerror = function() { isSpeaking = false; };
        setTimeout(function() { isSpeaking = false; }, 2500);

        window.speechSynthesis.speak(msg);
    }

    // 3초 쿨다운 적용 부정자세 기록 및 발화 통합 함수
    function triggerFault(typeKey, reason, ttsSpeech, detail) {
        var now = Date.now();
        // 동일 유형의 부정자세는 3초에 1회만 카운트 및 발화
        if (now - faultCooldowns[typeKey] >= 3000) {
            faultCooldowns[typeKey] = now;
            repHasFault = true;
            setFeedback("⚠️ " + reason, true);
            speak(ttsSpeech);
            logInvalidRep(reason, detail);
        }
    }

    function getAngle(A, B, C) {
        var rad = Math.atan2(C.y - B.y, C.x - B.x) - Math.atan2(A.y - B.y, A.x - B.x);
        var deg = Math.abs(rad * 180.0 / Math.PI);
        if (deg > 180.0) deg = 360.0 - deg;
        return Math.round(deg);
    }

    function setFeedback(text, isWarn) {
        var el = document.getElementById('feedbackText');
        el.innerText = text;
        el.className = isWarn ? "feedback-banner warn" : "feedback-banner";
    }

    function logInvalidRep(reason, detail) {
        failCount++;
        document.getElementById('failCount').innerText = failCount + "건";

        var emptyRow = document.getElementById('emptyRow');
        if (emptyRow) emptyRow.remove();

        var elapsedSec = totalSeconds - remainingSeconds;
        var m = Math.floor(elapsedSec / 60);
        var s = elapsedSec % 60;
        var timeStr = (m < 10 ? "0" + m : m) + "분 " + (s < 10 ? "0" + s : s) + "초";

        var tbody = document.getElementById('logTableBody');
        var tr = document.createElement('tr');
        tr.innerHTML = '<td class="td-time">' + timeStr + '</td>' +
                       '<td class="td-reason">' + reason + '</td>' +
                       '<td class="td-detail">' + detail + '</td>';
        tbody.insertBefore(tr, tbody.firstChild);
    }

    // 전체화면 토글
    function toggleFullscreen() {
        var btn = document.getElementById('btnFullscreen');
        if (!cameraBox.classList.contains('is-fullscreen')) {
            cameraBox.classList.add('is-fullscreen');
            btn.innerText = "✖ 전체화면 해제";
            if (cameraBox.requestFullscreen) {
                cameraBox.requestFullscreen().catch(function(){});
            } else if (cameraBox.webkitRequestFullscreen) {
                cameraBox.webkitRequestFullscreen();
            }
        } else {
            cameraBox.classList.remove('is-fullscreen');
            btn.innerText = "⛶ 전체화면";
            if (document.exitFullscreen) {
                document.exitFullscreen().catch(function(){});
            } else if (document.webkitExitFullscreen) {
                document.webkitExitFullscreen();
            }
        }
    }

    // 타이머 제어
    function setTimerPreset(sec, btn) {
        if (isTimerRunning) return;
        totalSeconds = sec;
        remainingSeconds = sec;
        updateTimerDisplay();
        var btns = document.querySelectorAll('.btn-preset');
        for (var i = 0; i < btns.length; i++) btns[i].classList.remove('active');
        if (btn) btn.classList.add('active');
        document.getElementById('inCustomSec').value = "";
    }

    function applyCustomTimer() {
        if (isTimerRunning) return;
        var val = parseInt(document.getElementById('inCustomSec').value, 10);
        if (!isNaN(val) && val >= 10 && val <= 600) {
            totalSeconds = val;
            remainingSeconds = val;
            updateTimerDisplay();
            var btns = document.querySelectorAll('.btn-preset');
            for (var i = 0; i < btns.length; i++) btns[i].classList.remove('active');
        }
    }

    function updateTimerDisplay() {
        var m = Math.floor(remainingSeconds / 60);
        var s = remainingSeconds % 60;
        document.getElementById('dispTimer').innerText = (m < 10 ? "0" + m : m) + ":" + (s < 10 ? "0" + s : s);
    }

    function startTimer() {
        if (isTimerRunning) return;
        isTimerRunning = true;
        document.getElementById('txtTimerState').innerText = "측정 진행 중";
        document.getElementById('txtTimerState').style.color = "#39e75f";
        speak("측정을 시작합니다");

        timerInterval = setInterval(function() {
            remainingSeconds--;
            updateTimerDisplay();

            if (remainingSeconds === 30) speak("30초 남았습니다");
            if (remainingSeconds === 10) speak("10초 전");

            if (remainingSeconds <= 0) {
                stopTimer();
                speak("측정 종료! 최종 " + repCount + "회입니다");
                setFeedback("🏁 측정 종료 (최종: " + repCount + "회)", false);
                document.getElementById('txtTimerState').innerText = "측정 완료";
                document.getElementById('txtTimerState').style.color = "#e5a93c";
            }
        }, 1000);
    }

    function stopTimer() {
        isTimerRunning = false;
        clearInterval(timerInterval);
        document.getElementById('btnMainAction').innerText = "▶️ 측정 재개";
        document.getElementById('btnMainAction').className = "action-btn btn-start";
    }

    function toggleTimerAndCamera() {
        if (!cameraStarted) {
            initPoseModel();
            startCameraStream();
            cameraStarted = true;
            document.getElementById('btnMainAction').innerText = "⏸️ 일시 정지";
            document.getElementById('btnMainAction').className = "action-btn btn-pause";
            startTimer();
        } else {
            if (isTimerRunning) {
                stopTimer();
                document.getElementById('txtTimerState').innerText = "일시 정지";
                document.getElementById('txtTimerState').style.color = "#e67e22";
            } else {
                startTimer();
                document.getElementById('btnMainAction').innerText = "⏸️ 일시 정지";
                document.getElementById('btnMainAction').className = "action-btn btn-pause";
            }
        }
    }

    function resetAll() {
        stopTimer();
        remainingSeconds = totalSeconds;
        updateTimerDisplay();
        repCount = 0;
        failCount = 0;
        state = "UP";
        minElbowInCurrentRep = 180;
        maxElbowInCurrentRep = 90;
        repHasFault = false;
        isSpeaking = false;
        for (var k in faultCooldowns) faultCooldowns[k] = 0;

        document.getElementById('repCount').innerText = "0";
        document.getElementById('failCount').innerText = "0건";
        document.getElementById('logTableBody').innerHTML = '<tr id="emptyRow"><td colspan="3" style="text-align:center; color:#8b9b8e; padding:12px;">부정자세 기록이 없습니다.</td></tr>';
        document.getElementById('txtTimerState').innerText = "대기 중";
        document.getElementById('txtTimerState').style.color = "#8b9b8e";
        document.getElementById('btnMainAction').innerText = cameraStarted ? "▶️ 측정 시작" : "📹 측정 시작 (카메라 ON)";
        document.getElementById('btnMainAction').className = "action-btn btn-start";
        setFeedback("측정 준비 완료", false);
    }

    function initPoseModel() {
        pose = new Pose({
            locateFile: function(file) {
                return "https://cdn.jsdelivr.net/npm/@mediapipe/pose/" + file;
            }
        });

        pose.setOptions({
            modelComplexity: 1,
            smoothLandmarks: true,
            minDetectionConfidence: 0.55,
            minTrackingConfidence: 0.55
        });

        pose.onResults(onPoseResults);
    }

    function startCameraStream() {
        if (camera) camera.stop();
        camera = new Camera(videoElement, {
            onFrame: async function() {
                if (cameraStarted) {
                    await pose.send({ image: videoElement });
                }
            },
            width: 640,
            height: 480,
            facingMode: facingMode
        });
        camera.start();
    }

    function switchCamera() {
        facingMode = (facingMode === "user") ? "environment" : "user";
        startCameraStream();
    }

    function onPoseResults(results) {
        canvasElement.width = videoElement.videoWidth || 640;
        canvasElement.height = videoElement.videoHeight || 480;

        canvasCtx.save();
        canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);

        if (facingMode === "user") {
            canvasCtx.translate(canvasElement.width, 0);
            canvasCtx.scale(-1, 1);
        }
        canvasCtx.drawImage(results.image, 0, 0, canvasElement.width, canvasElement.height);

        if (!results.poseLandmarks) {
            setFeedback("⚠️ 전신이 화면에 나오도록 거리를 조정하십시오", true);
            canvasCtx.restore();
            return;
        }

        var lm = results.poseLandmarks;
        var w = canvasElement.width;
        var h = canvasElement.height;

        var leftVis = (lm[11].visibility + lm[23].visibility + lm[27].visibility) / 3;
        var rightVis = (lm[12].visibility + lm[24].visibility + lm[28].visibility) / 3;
        var isLeft = leftVis >= rightVis;

        // 관절 랜드마크 추출
        var nose = lm[0];
        var shoulder = isLeft ? lm[11] : lm[12];
        var elbow = isLeft ? lm[13] : lm[14];
        var wrist = isLeft ? lm[15] : lm[16];
        var hip = isLeft ? lm[23] : lm[24];
        var knee = isLeft ? lm[25] : lm[26];
        var ankle = isLeft ? lm[27] : lm[28];
        var toe = isLeft ? lm[31] : lm[32];

        var pN = { x: nose.x * w, y: nose.y * h };
        var pS = { x: shoulder.x * w, y: shoulder.y * h };
        var pE = { x: elbow.x * w, y: elbow.y * h };
        var pW = { x: wrist.x * w, y: wrist.y * h };
        var pP = { x: hip.x * w, y: hip.y * h };
        var pK = { x: knee.x * w, y: knee.y * h };
        var pA = { x: ankle.x * w, y: ankle.y * h };
        var pT = { x: toe.x * w, y: toe.y * h };

        // 1. 관절 각도 산출
        var elbowAng = getAngle(pS, pE, pW);
        var coreAng = getAngle(pS, pP, pA);
        var kneeAng = getAngle(pP, pK, pA);

        document.getElementById('elbowAngle').innerText = elbowAng + "°";
        document.getElementById('coreAngle').innerText = coreAng + "°";

        // 2. 부정자세 감지 플래그
        var isCoreSag = (coreAng < 145);      // 허리 숙여짐 (처짐)
        var isCorePike = (coreAng > 185);     // 허리 세워짐 (솟음)
        var isKneeTouch = (kneeAng < 140);    // 무릎 닿음

        // 고개만 숙임 (가슴/어깨는 덜 내려왔는데 머리만 어깨선 아래로 과도하게 숙여짐)
        var isHeadBob = (elbowAng > 115) && ((pN.y - pS.y) > 45);

        // 3. 골격선 및 관절 노드 렌더링
        var isPostureBad = isCoreSag || isCorePike || isKneeTouch || isHeadBob;
        var boneColor = isPostureBad ? "#ff3333" : (state === "DOWN" ? "#e5a93c" : "#39e75f");

        drawBone(pN, pS, boneColor, 4);
        drawBone(pS, pE, boneColor, 5);
        drawBone(pE, pW, boneColor, 5);
        drawBone(pS, pP, boneColor, 5);
        drawBone(pP, pK, boneColor, 4);
        drawBone(pK, pA, boneColor, 4);
        drawBone(pA, pT, boneColor, 4);

        drawJoint(pN, "#ffffff", "머리");
        drawJoint(pS, "#39e75f", "어깨");
        drawJoint(pE, "#e5a93c", "팔꿈치 " + elbowAng + "°");
        drawJoint(pW, "#5dade2", "손목");
        drawJoint(pP, "#f4d03f", "골반 " + coreAng + "°");
        drawJoint(pK, isKneeTouch ? "#ff3333" : "#39e75f", "무릎 " + kneeAng + "°");
        drawJoint(pA, "#5dade2", "발끝");

        // 4. 측정 중 부정자세 판정 (3초 쿨다운 적용)
        if (isTimerRunning) {
            // (1) 실시간 체간 및 지면 부정자세 감지
            if (isCoreSag) {
                triggerFault("SAG", "허리 숙여짐 (처짐)", "허리가 숙여졌습니다", "코어: " + coreAng + "°");
            } else if (isCorePike) {
                triggerFault("PIKE", "허리 세워짐 (솟음)", "허리가 세워졌습니다", "코어: " + coreAng + "°");
            }

            if (isKneeTouch) {
                triggerFault("KNEE", "무릎 닿음", "무릎이 닿았습니다", "무릎각: " + kneeAng + "°");
            }

            if (isHeadBob) {
                triggerFault("HEAD", "고개만 숙임 (헤드 봅)", "고개만 숙였습니다", "팔꿈치: " + elbowAng + "°");
            }

            // (2) 하강 단계 (state === "UP")
            if (state === "UP") {
                if (elbowAng < minElbowInCurrentRep) {
                    minElbowInCurrentRep = elbowAng;
                }

                // 90도 이하 정자세 하강 완료
                if (elbowAng <= 90 && !isPostureBad) {
                    state = "DOWN";
                    maxElbowInCurrentRep = elbowAng;
                    setFeedback("✅ 충분 하강! 팔을 밀어 올리십시오", false);
                }
                // 하강하다가 90도까지 안 내려가고 중간에 다시 올라오는 경우 (가슴 미도달)
                else if (minElbowInCurrentRep <= 130 && (elbowAng - minElbowInCurrentRep > 18) && elbowAng > 105) {
                    triggerFault("SHALLOW", "덜 내려감 (가슴 미도달)", "덜 내려갔습니다", "최저: " + minElbowInCurrentRep + "°");
                    minElbowInCurrentRep = 180;
                }
            }
            // (3) 상승 단계 (state === "DOWN")
            else if (state === "DOWN") {
                if (elbowAng > maxElbowInCurrentRep) {
                    maxElbowInCurrentRep = elbowAng;
                }

                // 완전히 펴서 올라옴 (160도 이상)
                if (elbowAng >= 160) {
                    if (!repHasFault) {
                        repCount++;
                        document.getElementById('repCount').innerText = repCount;
                        setFeedback("정자세 인정 (" + repCount + "회)", false);
                        speak(repCount + "");
                    } else {
                        setFeedback("⚠️ 자세 불량으로 노카운트 처리", true);
                    }
                    state = "UP";
                    minElbowInCurrentRep = 180;
                    maxElbowInCurrentRep = 90;
                    repHasFault = false;
                }
                // 완전히 안 펴고(예: 140도 미만) 튕기듯 다시 내려가는 경우 (팔꿈치 미신전)
                else if (maxElbowInCurrentRep >= 115 && (maxElbowInCurrentRep - elbowAng > 15) && elbowAng < 150) {
                    triggerFault("INCOMPLETE", "팔꿈치 안 펴짐 (미신전)", "팔꿈치가 안 펴집니다", "최대: " + maxElbowInCurrentRep + "°");
                    maxElbowInCurrentRep = 90;
                }
            }
        }

        canvasCtx.restore();
    }

    function drawBone(p1, p2, color, width) {
        canvasCtx.strokeStyle = color;
        canvasCtx.lineWidth = width;
        canvasCtx.lineCap = "round";
        canvasCtx.beginPath();
        canvasCtx.moveTo(p1.x, p1.y);
        canvasCtx.lineTo(p2.x, p2.y);
        canvasCtx.stroke();
    }

    function drawJoint(p, color, label) {
        canvasCtx.fillStyle = color;
        canvasCtx.strokeStyle = "#ffffff";
        canvasCtx.lineWidth = 2;
        canvasCtx.beginPath();
        canvasCtx.arc(p.x, p.y, 6, 0, Math.PI * 2);
        canvasCtx.fill();
        canvasCtx.stroke();

        if (label) {
            canvasCtx.font = "bold 9.5px sans-serif";
            canvasCtx.fillStyle = "#ffffff";
            canvasCtx.fillText(label, p.x + 8, p.y - 4);
        }
    }
</script>
</body>
</html>
